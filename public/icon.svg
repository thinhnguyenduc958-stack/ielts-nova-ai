<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="120" y1="100" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="80" y1="256" x2="432" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C7D2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D9F99D" stop-opacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Modern Squircle Container (App Icon standard) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="118" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Radiant Soft Glow Field -->
  <circle cx="256" cy="256" r="140" fill="#7C3AED" opacity="0.35" filter="url(#softGlow)" />

  <!-- Sweeping Elliptical Orbit (Tilted -26 degrees) -->
  <ellipse
    cx="256"
    cy="256"
    rx="210"
    ry="98"
    transform="rotate(-26 256 256)"
    stroke="url(#orbitGrad)"
    stroke-width="12"
    stroke-dasharray="320 48"
    opacity="0.85"
  />

  <!-- Letter 'N' Left Pillar -->
  <rect
    x="124"
    y="110"
    width="46"
    height="292"
    rx="23"
    fill="url(#symbolGrad)"
  />

  <!-- Letter 'N' Right Pillar -->
  <rect
    x="342"
    y="110"
    width="46"
    height="292"
    rx="23"
    fill="url(#symbolGrad)"
  />

  <!-- Forward Diagonal Energy Beam -->
  <path
    d="M147 133 L365 379"
    stroke="url(#symbolGrad)"
    stroke-width="48"
    stroke-linecap="round"
  />

  <!-- Central Nova Intelligence Core Node -->
  <circle
    cx="256"
    cy="256"
    r="38"
    fill="#10B981"
  />

  <!-- Inner Sparkle -->
  <circle
    cx="256"
    cy="256"
    r="16"
    fill="#FFFFFF"
  />
</svg>
